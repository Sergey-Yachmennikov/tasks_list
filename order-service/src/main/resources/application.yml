spring:
  application:
    name: order-service
  datasource:
    # Соответствует порту, на котором docker-compose.yml (корень модуля) публикует Postgres.
    url: ${DB_URL:jdbc:postgresql://localhost:5457/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 5
        # KafkaTemplate#send() синхронно блокируется на получении метаданных/места в буфере
        # ещё до того, как вернёт Future — kafka.send-timeout (ограничение Future#get в
        # SpringKafkaProducer) на этом этапе просто не успевает сработать. Ограничиваем и
        # здесь тоже — иначе сбой брокера блокирует поток outbox-поллера на дефолтные для
        # Kafka 60 секунд вместо быстрого падения в путь ретрая/backoff.
        max.block.ms: 3000

server:
  port: ${SERVER_PORT:8100}

outbox:
  # poll-interval / cleanup-interval / reclaim-interval одновременно используются как значения
  # @Scheduled fixedDelayString, а те понимают только простые миллисекунды или ISO-8601
  # (в отличие от биндинга Duration в @ConfigurationProperties, который принимает ещё и
  # "500ms"/"1h" — ISO-8601 единственный формат, который читают оба механизма).
  batch-size: 100
  poll-interval: PT0.5S
  max-retries: 5
  initial-backoff: 1s
  max-backoff: 5m
  sent-retention: 7d
  cleanup-interval: PT1H
  stale-claim-timeout: 2m
  reclaim-interval: PT1M

kafka:
  send-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{aggregateId:-}]"
