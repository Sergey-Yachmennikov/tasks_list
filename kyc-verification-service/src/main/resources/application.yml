spring:
  application:
    name: kyc-verification-service
  datasource:
    # Соответствует порту, на котором docker-compose.yml (корень модуля) публикует Postgres.
    url: ${DB_URL:jdbc:postgresql://localhost:5456/kyc}
    username: ${DB_USERNAME:kyc}
    password: ${DB_PASSWORD:kyc}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8090}

kyc-provider:
  base-url: ${KYC_PROVIDER_BASE_URL:http://localhost:8082}
  connect-timeout: 1s
  read-timeout: 3s

notification:
  base-url: ${NOTIFICATION_BASE_URL:http://localhost:8083}
  connect-timeout: 1s
  read-timeout: 3s

resilience4j:
  circuitbreaker:
    instances:
      kyc:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      notification:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      kyc:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      notification:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{applicationId:-}]"
