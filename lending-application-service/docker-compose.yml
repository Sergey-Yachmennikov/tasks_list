services:
  postgres:
    image: postgres:16-alpine
    container_name: tasks-list-postgres
    environment:
      POSTGRES_DB: lending
      POSTGRES_USER: lending
      POSTGRES_PASSWORD: lending
    ports:
      - "5455:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lending -d lending"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
